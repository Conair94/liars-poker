sweep_name: ar2_distillation_count
phase: ar2
production: false
random_seed: 0
device: cpu

# One-axis sweep: deal count N. Each cell runs distillation, trains both
# heads on the cell's data, and reports per-n validation KL on the shared
# 2k held-out set (ar2_holdout_2k, generated by the pilot pre-flight).
axes:
  - key: N
    values: [1000, 5000, 10000, 50000]

runner:
  command: python -m training.ar2_pipeline
  args:
    N: "{N}"
  fixed:
    trunk-ckpt:        data/runs/ar1-20260430T030730Z-b64-h256-n2-fb17d031/handmodel/best.pt
    holdout-run-id:    ar2_holdout_2k
    max-iters:         200
    workers:           4
    seed:              0
    callpolicy-epochs: 20
    bidpolicy-epochs:  30
