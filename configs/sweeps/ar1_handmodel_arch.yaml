sweep_name: ar1_handmodel_arch
phase: ar1
production: false
random_seed: 0
device: cpu

# Architectural sweep over the AR-1 axes: trunk depth/width and the
# bid-history encoder ablation (bid_hist_dim=0 disables it). 12 cells
# total. Each cell trains one HandModel from scratch under the
# per-cell rollout dataset and reports per-`n` Brier on the held-out
# test split.
axes:
  - key: hidden_dim
    values: [64, 128, 256]
  - key: num_trunk_layers
    values: [1, 2]
  - key: bid_hist_dim
    values: [0, 64]

runner:
  command: python -m agents.learned.handmodel.trainer
  args:
    hidden-dim:        "{hidden_dim}"
    num-trunk-layers:  "{num_trunk_layers}"
    bid-hist-dim:      "{bid_hist_dim}"
  fixed:
    max-epochs: 30
    train-decisions-per-n: 250000
    val-decisions-per-n:    25000
    test-decisions-per-n:   25000
    rollout-agent: exact_adaptive
